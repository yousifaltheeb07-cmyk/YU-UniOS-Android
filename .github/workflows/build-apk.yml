name: Build YU UniOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -q YU-UniOS-Android-Project.zip -d source

      - name: Build APK
        run: |
          cd source/YU-UniOS-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YU-UniOS-APK
          path: source/YU-UniOS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
